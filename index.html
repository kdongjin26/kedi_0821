<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3김 프로젝트 : KEDI 참여 행동</title>
<meta name="description" content="제20회 KEDI 데이터 연구 학술대회 연구과제 — 중·고등학교 시기 참여의식의 발달 궤적과 성인 초기 정치참여">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314614a'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#15181c; --muted:#59616a;
  --line:#dde2e7; --accent:#14614a; --accent-soft:#e8f1ec; --band:#eef1f4;
  --side:270px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131619; --surface:#1a1e22; --ink:#e5e9ed; --muted:#98a1aa;
  --line:#2b3138; --accent:#5cc79c; --accent-soft:#152a23; --band:#20252a;
}}
:root[data-theme="dark"]{
  --bg:#131619; --surface:#1a1e22; --ink:#e5e9ed; --muted:#98a1aa;
  --line:#2b3138; --accent:#5cc79c; --accent-soft:#152a23; --band:#20252a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); word-break:keep-all;
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,-apple-system,sans-serif;
  display:grid; grid-template-columns:var(--side) 1fr; height:100vh; overflow:hidden;
}

/* ---------- 좌측 사이드바 ---------- */
aside{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0; overflow-y:auto;
}
.brand{padding:20px 20px 16px; border-bottom:1px solid var(--line)}
.brand h1{margin:0; font-size:1.02rem; font-weight:700; line-height:1.45; letter-spacing:-.01em}
.brand h1 .sep{color:var(--accent); margin:0 .3em; font-weight:500}
.brand .sub{display:block; margin-top:6px; font-size:.74rem; color:var(--muted); line-height:1.6}
nav{padding:14px 12px; flex:1 1 auto}
.group{margin-bottom:22px}
.group > .glabel{
  display:flex; align-items:center; gap:9px;
  padding:8px 12px; margin-bottom:8px; border-radius:7px;
  background:var(--accent); color:#fff;
  font-size:.95rem; font-weight:700; letter-spacing:.01em;
}
.group > .glabel .dot{
  width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.85); flex:0 0 auto;
}
.group > .glabel .cnt{
  margin-left:auto; font-size:.72rem; font-weight:500;
  background:rgba(255,255,255,.2); padding:2px 8px; border-radius:999px;
}
nav .items{padding-left:6px; border-left:2px solid var(--line); margin-left:8px}
nav button{
  display:block; width:100%; text-align:left; appearance:none; cursor:pointer;
  font:inherit; font-size:.84rem; font-weight:500; color:var(--muted);
  background:none; border:0; border-radius:6px; padding:8px 11px; margin-bottom:1px;
  transition:.13s; line-height:1.4;
}
nav button:hover{background:var(--band); color:var(--ink)}
nav button[aria-selected="true"]{
  background:var(--accent-soft); color:var(--accent); font-weight:600;
}
nav button small{display:block; font-size:.71rem; font-weight:400; opacity:.72; margin-top:2px}
aside footer{
  padding:14px 20px 18px; border-top:1px solid var(--line);
  font-size:.74rem; color:var(--muted);
}

/* ---------- 콘텐츠 ---------- */
main{display:flex; flex-direction:column; min-width:0; min-height:0; padding:16px 20px 18px}
.meta{display:flex; align-items:flex-start; justify-content:space-between;
  gap:14px; flex-wrap:wrap; margin:0 0 10px}
.meta .title{font-size:.95rem; font-weight:600; line-height:1.45}
.meta .title small{display:block; font-weight:400; color:var(--muted);
  font-size:.79rem; margin-top:3px}
.meta .links{display:flex; gap:8px; flex-shrink:0}
.meta a{
  font-size:.79rem; text-decoration:none; color:var(--accent);
  border:1px solid var(--line); background:var(--surface);
  padding:6px 12px; border-radius:6px; transition:.13s; white-space:nowrap;
}
.meta a:hover{border-color:var(--accent); background:var(--accent-soft)}
.frame{flex:1 1 auto; min-height:0; border:1px solid var(--line);
  border-radius:9px; overflow:hidden; background:var(--surface)}
.frame iframe{width:100%; height:100%; border:0; display:block; background:var(--surface)}
.panel{flex:1 1 auto; display:none; flex-direction:column; min-height:0}
.panel.active{display:flex}

/* ---------- 모바일 ---------- */
.menu-toggle{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr; height:auto; overflow:auto}
  aside{
    position:sticky; top:0; z-index:20; border-right:0;
    border-bottom:1px solid var(--line); max-height:none;
  }
  nav{display:none; padding:10px 12px 14px}
  body.nav-open nav{display:block}
  aside footer{display:none}
  .menu-toggle{
    display:block; position:absolute; right:16px; top:18px;
    appearance:none; background:var(--band); border:1px solid var(--line);
    color:var(--ink); font:inherit; font-size:.8rem; padding:6px 12px;
    border-radius:6px; cursor:pointer;
  }
  .brand{position:relative}
  main{padding:14px 16px 18px}
  .frame{min-height:72vh}
}
</style>
</head>
<body>

<aside>
  <div class="brand">
    <h1>3김 프로젝트<span class="sep">:</span>KEDI 참여 행동</h1>
    <span class="sub">제20회 KEDI 데이터 연구 학술대회<br>회의 및 검토용</span>
    <button class="menu-toggle" id="toggle" type="button">메뉴</button>
  </div>
  <nav id="nav" aria-label="주 메뉴"></nav>
  <footer>2026.08.24. 기준</footer>
</aside>

<main id="main"></main>

<script>
const SECTIONS = [
  { id:"overview", label:"개요", tabs:[
    { id:"announcement", label:"공고", note:"학술대회 공모 공고문",
      title:"제20회 KEDI 데이터 연구 학술대회 공모 공고문",
      sub:"공모 개요 · 지원 자격 · 제출 서류 · 심사 일정",
      src:"docs/announcement.pdf", type:"pdf" },
    { id:"plan", label:"계획", note:"제출·승인된 연구계획서", title:"연구계획서",
      sub:"중·고등학교 시기 참여의식이 성인기 정치적 참여 행동에 미치는 영향 (심사 통과본)",
      src:"docs/plan.pdf", type:"pdf" },
    { id:"notice", label:"안내", note:"선정 결과 통보", title:"공모 결과 안내",
      sub:"제20회 KEDI 데이터 연구 학술대회 공모 결과",
      src:"docs/notice.pdf", type:"pdf" }
  ]},
  { id:"analysis", label:"분석", tabs:[
    { id:"0", label:"기술통계", note:"원자료 전체 변수",
      title:"기술통계 — 분석 변수의 기술통계",
      sub:"KELS2013 원자료 기준 · 완전제거 적용 이전 · 원표본 7,324명",
      src:"reports/descriptives.html", type:"html" },
    { id:"1", label:"분석1", note:"중1~고3 선형 성장",
      title:"분석1 — 참여의식 궤적과 성인 초기 정치참여",
      sub:"중1~고3 6시점 · 선형 성장 6요인 · N=5,294",
      src:"reports/analysis1.html", type:"html" },
    { id:"2", label:"분석2", note:"중1~고1 공통 이수기",
      title:"분석2 — 공통 이수기 참여의식과 성인 초기 정치참여",
      sub:"중1~고1 4시점 · 선형 성장 6요인 · N=5,634",
      src:"reports/analysis2.html", type:"html" },
    { id:"3", label:"분석3", note:"고1 분절 이중 기울기",
      title:"분석3 — 고1 분절 이중 기울기 모형",
      sub:"중1~고3 6시점 · 절편·전반·후반 9요인 · N=5,294",
      src:"reports/analysis3.html", type:"html" },
    { id:"4", label:"분석4", note:"문·이과 다집단",
      title:"분석4 — 문·이과 계열에 따른 궤적과 정치참여",
      sub:"분석3 + 계열 다집단 · 문과 2,375 / 이과 2,220",
      src:"reports/analysis4.html", type:"html" },
    { id:"5", label:"분석5", note:"참여 유형 4범주",
      title:"분석5 — 성인 초기 정치참여 유형과 참여의식 성장",
      sub:"참여 4범주 유형화 · 비참여 기준 대비 · N=4,498",
      src:"reports/analysis5.html", type:"html" },
    { id:"6", label:"분석6", note:"행동 지향 제외",
      title:"분석6 — 행동 지향을 제외한 2요인 사양",
      sub:"억제효과 제거 · 시민 효능감 + 인지적 관여 4요인 · N=5,294",
      src:"reports/analysis6.html", type:"html" },
    { id:"7", label:"분석7", note:"투표 의도 통제",
      title:"분석7 — 투표 의도를 통제한 사양",
      sub:"분석6 + 중1 투표 의도 통제 · 고3 실제 투표 대조 · N=5,294",
      src:"reports/analysis7.html", type:"html" }
  ]}
];

const nav = document.getElementById("nav");
const main = document.getElementById("main");
const built = new Set();
const find = id => SECTIONS.find(s => s.id === id);
const pid = (s, t) => "p-" + s + "-" + t;

function ensurePanel(sec, tab){
  const key = pid(sec, tab.id);
  if (built.has(key)) return;
  built.add(key);
  const el = document.createElement("section");
  el.className = "panel"; el.id = key;
  el.innerHTML =
    '<div class="meta">' +
      '<div class="title">' + tab.title + '<small>' + tab.sub + '</small></div>' +
      '<div class="links">' +
        '<a href="' + tab.src + '" target="_blank" rel="noopener">새 탭에서 열기</a>' +
        (tab.type === "pdf" ? '<a href="' + tab.src + '" download>내려받기</a>' : '') +
      '</div>' +
    '</div>' +
    '<div class="frame"><iframe title="' + tab.title + '" loading="lazy" src="' +
      tab.src + (tab.type === "pdf" ? "#view=FitH" : "") + '"></iframe></div>';
  main.appendChild(el);
}

function buildNav(secId, tabId){
  nav.innerHTML = "";
  SECTIONS.forEach(sec => {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = '<span class="glabel"><span class="dot"></span>' + sec.label +
                  '<span class="cnt">' + sec.tabs.length + '</span></span>';
    const box = document.createElement("div");
    box.className = "items";
    g.appendChild(box);
    sec.tabs.forEach(t => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = t.label + (t.note ? '<small>' + t.note + '</small>' : '');
      b.setAttribute("aria-selected", String(sec.id === secId && t.id === tabId));
      b.onclick = () => {
        location.hash = "#/" + sec.id + "/" + t.id;
        document.body.classList.remove("nav-open");
      };
      box.appendChild(b);
    });
    nav.appendChild(g);
  });
}

function render(secId, tabId){
  const sec = find(secId) || SECTIONS[0];
  const tab = sec.tabs.find(t => t.id === tabId) || sec.tabs[0];
  buildNav(sec.id, tab.id);
  ensurePanel(sec.id, tab);
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("active", p.id === pid(sec.id, tab.id)));
  document.title = tab.title + " · 3김 프로젝트 : KEDI 참여 행동";
}

function route(){
  const m = /^#\/([a-z]+)\/([\w-]+)$/.exec(location.hash || "");
  if (m && find(m[1])) render(m[1], m[2]);
  else render("overview", "announcement");
}

document.getElementById("toggle").onclick = () =>
  document.body.classList.toggle("nav-open");
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
