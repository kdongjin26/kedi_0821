<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KEDI 참여 행동 — 검토 페이지</title>
<style>
  :root { --bg:#fbfbfa; --fg:#2b2b2b; --mut:#6b6b6b; --line:#e3e3e0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#191918; --fg:#e8e8e6; --mut:#9a9a96; --line:#33332f; }
  }
  :root[data-theme="dark"] { --bg:#191918; --fg:#e8e8e6; --mut:#9a9a96; --line:#33332f; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    line-height:1.75; display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:48px 16px;
  }
  main { max-width:30rem; width:100%; }
  h1 { font-size:1.25rem; font-weight:600; margin:0 0 1.25rem; letter-spacing:-0.01em; }
  p { margin:0 0 0.9rem; color:var(--mut); font-size:0.95rem; }
  hr { border:0; border-top:1px solid var(--line); margin:1.75rem 0; }
  .meta { font-size:0.825rem; color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>검토 페이지는 현재 운영하지 않습니다</h1>
  <p>제20회 KEDI 데이터 연구 학술대회 연구과제의 검토용 페이지입니다. 현재 비공개로 전환되어 있습니다.</p>
  <p>문의는 연구진에게 직접 주시기 바랍니다.</p>
  <hr>
  <p class="meta">2026년 9월 21일부터 미운영</p>
</main>
</body>
</html>
